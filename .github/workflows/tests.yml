name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build app target
        run: |
          xcodebuild build \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Perch.xcodeproj \
            -scheme PerchModelTests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData
