name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build app target
        run: |
          xcodebuild build \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Perch.xcodeproj \
            -scheme PerchModelTests \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData
