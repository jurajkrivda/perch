name: Perch

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.5"

targets:
  Perch:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Perch
        excludes:
          - Resources
          - Info.plist
          - Perch.entitlements
      - path: Perch/Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Perch
        PRODUCT_BUNDLE_IDENTIFIER: com.jurajkrivda.perch
        INFOPLIST_FILE: Perch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Perch/Perch.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          COPY_PHASE_STRIP: YES
          ENABLE_HARDENED_RUNTIME: YES
          VALIDATE_PRODUCT: YES

  PerchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PerchTests
      - path: Perch/Infrastructure/Localization
      - path: Perch/Models
      - path: Perch/Core/AccessibilityManager.swift
      - path: Perch/Core/AutoRestoreAttemptState.swift
      - path: Perch/Core/AutoRestorePolicy.swift
      - path: Perch/Core/DisplayManager.swift
      - path: Perch/Core/DisplayStabilizer.swift
      - path: Perch/Core/OverlayWindowPlacement.swift
      - path: Perch/Core/SlotEngine.swift
      - path: Perch/Core/CGRectExtensions.swift
      - path: Perch/Core/WindowMover.swift
      - path: Perch/Core/WindowSnapshotter.swift
      - path: Perch/Infrastructure/HotkeyRegistrationState.swift
      - path: Perch/Infrastructure/LegacyLicensingDataCleaner.swift
      - path: Perch/Infrastructure/LaunchAtLogin.swift
      - path: Perch/Infrastructure/Logger.swift
      - path: Perch/UI/Settings/SettingsTaskState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jurajkrivda.perch.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PerchModelTests:
    build:
      targets:
        PerchTests: all
    test:
      targets:
        - PerchTests
